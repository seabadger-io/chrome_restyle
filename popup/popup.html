<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Restyle</title>
  <link rel="stylesheet" href="../ui/common.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="logo">R</div>
    <div class="header-text">
      <h1>Restyle</h1>
      <div id="host" class="host">—</div>
    </div>
    <button id="btn-manage" class="btn ghost small" title="Manage all rules">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Rules
    </button>
  </header>

  <main>
    <div id="us-banner" class="banner hidden">
      <span>⚠️</span>
      <span>A rule here has <b>JavaScript</b>, but user scripts are disabled. Open
        <a href="#" id="open-ext-settings">extension details</a> and turn on <b>Allow User Scripts</b>
        (or Developer mode on older Chrome).</span>
    </div>

    <div class="section-title">
      <span>Active on this page</span>
      <span id="count" class="chip">0</span>
    </div>

    <ul id="rules" class="rules"></ul>

    <div id="empty" class="empty hidden">
      <div class="empty-icon">🎨</div>
      <div>No rules match this page yet.</div>
    </div>

    <div id="unsupported" class="empty hidden">
      <div class="empty-icon">🔒</div>
      <div>Chrome doesn't allow extensions on this page.</div>
    </div>
  </main>

  <footer class="footer">
    <button id="btn-new" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New rule for this site
    </button>
    <button id="btn-reload" class="btn" title="Reload tab (needed for JS changes)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </footer>

  <script src="../lib/match.js"></script>
  <script src="popup.js"></script>
</body>
</html>
